<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FOLIO STOCK - ปฏิทินงาน</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== แถบควบคุมเดือน ===== */
    .cal-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 20px; border-bottom: 1px solid #F1F5F9;
    }
    .cal-month {
      font-size: 17px; font-weight: 700; color: #0F172A;
      min-width: 165px; text-align: center;
    }
    .cal-nav {
      width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid #E2E8F0;
      background: white; color: #374151; font-size: 16px; cursor: pointer;
      font-family: Sarabun, sans-serif;
    }
    .cal-nav:hover { border-color: #93C5FD; color: #1E40AF; background: #EFF6FF; }
    .mode-btn {
      padding: 6px 12px; border-radius: 8px; border: 1.5px solid #E2E8F0;
      background: white; font-family: Sarabun, sans-serif; font-size: 13px;
      font-weight: 600; cursor: pointer; color: #64748B;
    }
    .mode-btn.active { background: #2563EB; color: white; border-color: #2563EB; }

    /* ===== ตารางปฏิทิน ===== */
    .cal-scroll { overflow-x: auto; padding: 16px 20px 20px; }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr));
      gap: 6px; min-width: 1050px;
    }
    .cal-head {
      text-align: center; font-size: 13px; font-weight: 700; color: #64748B;
      padding: 6px 0;
    }
    .cal-head.sun, .cal-head.sat { color: #DC2626; }

    .cal-cell {
      background: white; border: 1.5px solid #E2E8F0; border-radius: 10px;
      min-height: 108px; padding: 6px 7px 8px; display: flex; flex-direction: column; gap: 4px;
    }
    .cal-cell.empty { background: #F8FAFC; border-style: dashed; border-color: #EEF2F6; min-height: 60px; }
    .cal-cell.today { border-color: #2563EB; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
    .cal-daynum { font-size: 13px; font-weight: 700; color: #94A3B8; }
    .cal-cell.today .cal-daynum { color: #1E40AF; }
    .cal-daynum .today-tag {
      font-size: 10px; font-weight: 700; background: #2563EB; color: white;
      border-radius: 99px; padding: 1px 7px; margin-left: 4px;
    }

    /* ===== การ์ดงานในแต่ละวัน ===== */
    .task-chip {
      border-left: 3px solid #94A3B8; background: #F8FAFC; border-radius: 6px;
      padding: 4px 6px; font-size: 11.5px; line-height: 1.45; cursor: default;
    }
    .task-chip .t-name {
      font-weight: 600; color: #0F172A; display: block;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .task-chip .t-meta { color: #64748B; font-size: 10.5px; display: flex; gap: 6px; flex-wrap: wrap; }
    .task-chip .t-pct { font-weight: 700; }

    /* งานเสร็จแล้ว = เขียว */
    .task-chip.done { border-left-color: #16A34A; background: #F0FDF4; }
    .task-chip.done .t-name { color: #166534; }
    .task-chip.done .t-pct { color: #16A34A; }
    /* งานเกินกำหนด (ยังไม่เสร็จ) = แดง */
    .task-chip.overdue { border-left-color: #DC2626; background: #FEF2F2; }
    .task-chip.overdue .t-pct { color: #DC2626; }
    /* กำลังทำ */
    .task-chip.doing { border-left-color: #D97706; background: #FFFBEB; }
    .task-chip.doing .t-pct { color: #B45309; }

    /* ปุ่ม "+N งาน" ตอนงานเยอะเกินช่อง */
    .more-btn {
      margin-top: auto; border: none; background: #EFF6FF; color: #1E40AF;
      border-radius: 6px; padding: 4px 6px; font-family: Sarabun, sans-serif;
      font-size: 11px; font-weight: 700; cursor: pointer; width: 100%;
    }
    .more-btn:hover { background: #DBEAFE; }

    /* รายการงานทั้งวันในโมดัล */
    .day-row {
      display: flex; align-items: flex-start; gap: 10px; padding: 9px 0;
      border-bottom: 1px solid #F1F5F9; font-size: 13px;
    }
    .day-row:last-child { border-bottom: none; }
    .day-row .n { color: #94A3B8; font-weight: 700; min-width: 20px; }
    .day-row .nm { flex: 1; font-weight: 600; color: #0F172A; }
    .day-row .dt { color: #64748B; font-size: 12px; white-space: nowrap; }
    .day-row .pc { font-weight: 700; min-width: 44px; text-align: right; }
    .day-row.done { background: #F0FDF4; }
    .day-row.done .nm { color: #166534; }
    .day-row.done .pc { color: #16A34A; }
    .day-row.overdue .pc { color: #DC2626; }
    .day-row.doing .pc { color: #B45309; }

    .cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: #64748B; align-items: center; }
    .lg { display: inline-flex; align-items: center; gap: 5px; }
    .lg i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

    .cal-sum { font-size: 13px; color: #64748B; }
    .cal-sum b { color: #0F172A; }

    @media (max-width: 640px) {
      .cal-month { min-width: 130px; font-size: 15px; }
      .cal-scroll { padding: 12px 10px 16px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <span class="nav-brand">📦 FOLIO STOCK</span>
    <div class="nav-right">
      <span class="nav-username" id="navUserName"></span>
      <span class="nav-role" id="navRole"></span>
      <button class="btn btn-secondary btn-sm" onclick="logout()">ออกจากระบบ</button>
    </div>
  </nav>
  <div class="admin-tabs" id="navTabs"></div>

  <div class="main">
    <div class="card">
      <div class="card-header">
        <span class="card-title">📅 ปฏิทินงาน</span>
        <div class="cal-legend">
          <span class="lg"><i style="background:#16A34A"></i> เสร็จแล้ว</span>
          <span class="lg"><i style="background:#D97706"></i> กำลังทำ</span>
          <span class="lg"><i style="background:#DC2626"></i> เกินกำหนด</span>
          <span class="lg"><i style="background:#94A3B8"></i> ยังไม่เริ่ม</span>
        </div>
      </div>

      <div class="cal-bar">
        <button class="cal-nav" onclick="shiftMonth(-1)" title="เดือนก่อนหน้า">‹</button>
        <span class="cal-month" id="calMonthLabel">—</span>
        <button class="cal-nav" onclick="shiftMonth(1)" title="เดือนถัดไป">›</button>
        <button class="btn btn-outline btn-sm" onclick="goThisMonth()">เดือนนี้</button>

        <span style="width:1px;height:24px;background:#E2E8F0;margin:0 4px"></span>

        <span style="font-size:13px;color:#374151;font-weight:600">วางงานตาม:</span>
        <button class="mode-btn active" id="modeStart" onclick="setMode('start')">วันเริ่มงาน</button>
        <button class="mode-btn" id="modeDeadline" onclick="setMode('deadline')">Deadline</button>

        <span class="cal-sum" id="calSummary" style="margin-left:auto"></span>
      </div>

      <div id="calContainer">
        <div class="loading"><div class="spinner"></div> กำลังโหลด...</div>
      </div>
    </div>
  </div>

  <!-- โมดัลดูงานทั้งหมดของวันนั้น -->
  <div id="dayModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeDayModal()">
    <div class="modal" style="max-width:640px">
      <div class="modal-header">
        <span class="modal-title" id="dayModalTitle">งานของวันที่</span>
        <button class="modal-close" onclick="closeDayModal()">✕</button>
      </div>
      <div class="modal-body" id="dayModalBody"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js?v=2"></script>
  <script>
    let user, allTasks = [];
    let viewYear, viewMonth;            // เดือนที่กำลังดู (month = 0-11)
    let placeMode = 'start';            // 'start' = วางตามวันเริ่มงาน / 'deadline' = วางตาม Deadline
    let dayCache = {};                  // งานแยกตามวัน (ให้โมดัลใช้)
    const MAX_CHIPS = 4;                // โชว์ในช่องปฏิทินไม่เกินกี่งาน ที่เหลือกดดูในโมดัล

    const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                       'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    const TH_DAYS = ['อา','จ','อ','พ','พฤ','ศ','ส'];

    async function init() {
      user = requireAuth(['admin', 'staff', 'monitor']);
      if (!user) return;
      setNavUser(user);
      renderNav('calendar');
      const now = todayThai();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth();
      await loadTasks();
    }

    // วันนี้ตามเวลาไทย
    function todayThai() {
      const thai = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Bangkok' }));
      thai.setHours(0, 0, 0, 0);
      return thai;
    }

    // "dd/MM/yyyy" -> Date (null ถ้าไม่มี/ผิดรูป)
    function parseThai(s) {
      if (!s) return null;
      const p = String(s).split('/');
      if (p.length !== 3) return null;
      const d = new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
      return isNaN(d) ? null : d;
    }
    function shortDate(s) {
      const d = parseThai(s);
      return d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}` : '-';
    }

    async function loadTasks() {
      document.getElementById('calContainer').innerHTML =
        '<div class="loading"><div class="spinner"></div> กำลังโหลด...</div>';
      try {
        // ดึงงานทั้งหมด (ปฏิทินต้องเห็นทั้งงานที่ยังไม่เสร็จและงานที่เสร็จแล้วในเดือนนั้น)
        const r = await apiGet({ action: 'getTasks', role: 'admin' });
        if (!r.success) throw new Error(r.error || 'โหลดข้อมูลไม่สำเร็จ');
        allTasks = r.tasks;
        render();
      } catch (e) {
        document.getElementById('calContainer').innerHTML =
          `<div class="alert alert-danger" style="margin:16px 20px">⚠️ ${e.message}</div>`;
      }
    }

    function shiftMonth(n) {
      const d = new Date(viewYear, viewMonth + n, 1);
      viewYear = d.getFullYear(); viewMonth = d.getMonth();
      render();
    }
    function goThisMonth() {
      const now = todayThai();
      viewYear = now.getFullYear(); viewMonth = now.getMonth();
      render();
    }
    function setMode(m) {
      placeMode = m;
      document.getElementById('modeStart').classList.toggle('active', m === 'start');
      document.getElementById('modeDeadline').classList.toggle('active', m === 'deadline');
      render();
    }

    function isDone(t) { return t.status === 'เสร็จเรียบร้อย' || t.percent === '100%'; }

    // งานนี้ควรอยู่วันไหนของปฏิทิน (คืนเลขวันที่ หรือ null ถ้าไม่อยู่ในเดือนที่ดู)
    function dayOfTask(t) {
      const d = parseThai(placeMode === 'start' ? t.startDate : t.deadline);
      if (!d) return null;
      if (d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) return null;
      return d.getDate();
    }

    function chipClass(t) {
      if (isDone(t)) return 'done';
      const dl = parseThai(t.deadline);
      const today = todayThai();
      if (dl && dl < today) return 'overdue';
      if (t.status && t.status !== 'ยังไม่เริ่ม') return 'doing';
      return '';
    }

    function render() {
      document.getElementById('calMonthLabel').textContent = `${TH_MONTHS[viewMonth]} ${viewYear}`;

      // จัดงานเข้าแต่ละวัน
      const byDay = {};
      let inMonth = 0, doneCount = 0;
      allTasks.forEach(t => {
        const day = dayOfTask(t);
        if (day === null) return;
        (byDay[day] = byDay[day] || []).push(t);
        inMonth++;
        if (isDone(t)) doneCount++;
      });
      // ในแต่ละวัน เรียงงานที่ยังไม่เสร็จขึ้นก่อน
      Object.values(byDay).forEach(list =>
        list.sort((a, b) => (isDone(a) ? 1 : 0) - (isDone(b) ? 1 : 0))
      );

      document.getElementById('calSummary').innerHTML =
        `เดือนนี้มี <b>${inMonth}</b> งาน · เสร็จแล้ว <b style="color:#16A34A">${doneCount}</b> · ค้าง <b style="color:#D97706">${inMonth - doneCount}</b>`;

      const first = new Date(viewYear, viewMonth, 1);
      const startBlank = first.getDay();                       // 0=อาทิตย์
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const today = todayThai();
      const isThisMonth = today.getFullYear() === viewYear && today.getMonth() === viewMonth;

      let cells = TH_DAYS.map((d, i) =>
        `<div class="cal-head ${i===0?'sun':''}${i===6?'sat':''}">${d}</div>`).join('');

      for (let i = 0; i < startBlank; i++) cells += `<div class="cal-cell empty"></div>`;

      dayCache = byDay; // เก็บไว้ให้โมดัลใช้
      for (let day = 1; day <= daysInMonth; day++) {
        const list = byDay[day] || [];
        const isToday = isThisMonth && today.getDate() === day;
        // โชว์ในช่องไม่เกิน MAX_CHIPS ที่เหลือกดดูในโมดัล (กันช่องยืดยาวจนปฏิทินเสียรูป)
        const shown = list.slice(0, MAX_CHIPS);
        const chips = shown.map((t, idx) => `
          <div class="task-chip ${chipClass(t)}" title="${escHtml(t.task)}">
            <span class="t-name">${idx + 1}. ${escHtml(t.task)}</span>
            <span class="t-meta">
              <span>📅 ${shortDate(t.startDate)} → ${shortDate(t.deadline)}</span>
              <span class="t-pct">${t.percent || '0%'}</span>
            </span>
          </div>`).join('');
        const more = list.length > MAX_CHIPS
          ? `<button class="more-btn" onclick="openDayModal(${day})">+ อีก ${list.length - MAX_CHIPS} งาน (ดูทั้งหมด ${list.length})</button>`
          : (list.length ? `<button class="more-btn" onclick="openDayModal(${day})" style="background:#F8FAFC;color:#64748B">ดูทั้งหมด ${list.length} งาน</button>` : '');

        cells += `
          <div class="cal-cell ${isToday ? 'today' : ''}">
            <div class="cal-daynum">${day}${isToday ? '<span class="today-tag">วันนี้</span>' : ''}</div>
            ${chips}${more}
          </div>`;
      }

      document.getElementById('calContainer').innerHTML =
        `<div class="cal-scroll"><div class="cal-grid">${cells}</div></div>`;
    }

    // ===== โมดัลดูงานทั้งหมดของวันนั้น =====
    function openDayModal(day) {
      const list = dayCache[day] || [];
      document.getElementById('dayModalTitle').textContent =
        `📅 งานวันที่ ${day} ${TH_MONTHS[viewMonth]} ${viewYear} (${list.length} งาน)`;
      document.getElementById('dayModalBody').innerHTML = list.map((t, i) => `
        <div class="day-row ${chipClass(t)}">
          <span class="n">${i + 1}.</span>
          <span class="nm">${escHtml(t.task)}</span>
          <span class="dt">${shortDate(t.startDate)} → ${shortDate(t.deadline)}</span>
          <span class="pc">${t.percent || '0%'}</span>
        </div>`).join('') || '<div class="empty-state"><span class="icon">📋</span><p>ไม่มีงานในวันนี้</p></div>';
      document.getElementById('dayModal').style.display = 'flex';
    }
    function closeDayModal() { document.getElementById('dayModal').style.display = 'none'; }

    function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    init();
  </script>
</body>
</html>
